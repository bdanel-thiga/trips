<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carnets de voyage</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>

<!-- HERO -->
<div class="hero" style="background-image: url('istanbul/img/hero.jpg')">
    <div class="hero-content">
        <div class="hero-eyebrow">Carnets de voyage</div>
        <h1>Mes<br>voyages</h1>
        <div class="hero-meta">
            <span>2026 — 2027</span>
            <div class="hero-divider"></div>
            <span>Istanbul · Malaisie</span>
        </div>
    </div>
</div>

<!-- VOYAGES -->
<section class="trips-section">
    <div class="trips-section-label">Tous les voyages</div>
    <div class="trips-grid">

        <a class="trip-card" href="istanbul/index.html">
            <div class="trip-card-photo" style="background-image: url('istanbul/img/blue-mosque.jpg')"></div>
            <div class="trip-card-overlay">
                <div class="trip-card-year">2026</div>
                <div class="trip-card-name">Istanbul</div>
                <div class="trip-card-meta">12 — 17 Mai · 5 jours · 2 continents</div>
                <div class="trip-card-cta">Voir le carnet →</div>
            </div>
        </a>

        <div class="trip-card soon">
            <div class="trip-card-photo" style="background-image: url('istanbul/img/bosphorus.jpg'); filter: grayscale(0.4)"></div>
            <div class="trip-card-overlay">
                <div class="trip-card-year">2027</div>
                <div class="trip-card-name">Malaisie</div>
                <div class="trip-card-meta">Kuala Lumpur · Penang · Langkawi</div>
                <div class="trip-badge">À venir</div>
            </div>
        </div>

    </div>
</section>

<footer>
    <div class="footer-title">Carnets de voyage</div>
    <p>Istanbul 2026 · Malaisie 2027</p>
</footer>

</body>
</html>
